name: 更新数据并发布 APP

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # 工作日北京时间约 06:47 和 08:17；均在美股收盘后、A股开盘前。
    - cron: "47 22 * * 1-5"
    - cron: "17 0 * * 2-6"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 抓取最新情绪数据
        env:
          DATA_DIR: site/data
          NDX_PE_PERCENTILE_YEARS: "10"
        run: python app.py
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上传网页
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
