name: 更新数据并发布 APP

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # 工作日北京时间约 06:47 和 08:17：美股收盘后、A股开盘前。
    - cron: "47 22 * * 1-5"
    - cron: "17 0 * * 2-6"
    # 工作日北京时间约 15:20：A股收盘后更新场内ETF溢价。
    - cron: "20 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 抓取最新情绪数据
        env:
          DATA_DIR: site/data
          NDX_PE_PERCENTILE_YEARS: "10"
        run: python app.py
      - name: 获取第三方纳指12维度评分
        run: python scripts/fetch_btcdca.py
      - name: 获取13只纳指ETF近120个交易日溢价数据
        run: python scripts/fetch_etf_premiums.py
      - name: 保存每日ETF溢价历史
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/etf-premium-history.json
          if git diff --cached --quiet; then
            echo "今日溢价历史没有变化"
          else
            git commit -m "chore: record daily ETF premiums [skip ci]"
            git push origin HEAD:main
          fi
      - name: 发布到 gh-pages 分支
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
