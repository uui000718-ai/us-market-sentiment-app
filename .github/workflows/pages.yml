name: 更新数据并发布 APP

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # 工作日北京时间约 06:47 和 08:17；均在美股收盘后、A股开盘前。
    - cron: "47 22 * * 1-5"
    - cron: "17 0 * * 2-6"

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 抓取最新情绪数据
        env:
          DATA_DIR: site/data
          NDX_PE_PERCENTILE_YEARS: "10"
        run: python app.py
      - name: 获取第三方纳指12维度评分
        run: python scripts/fetch_btcdca.py
      - name: 发布到 gh-pages 分支
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
